<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Readreceipt 2.0 — Mobile</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #1a1612; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(20,17,13,0.18); border-radius: 2px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="lib.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>

<script type="text/babel" data-presets="react">
const Frame = ({ children }) => (
  <IOSDevice width={402} height={874}>{children}</IOSDevice>
);

const App = () => (
  <DesignCanvas defaultZoom={0.55}>
    <DCSection
      id="mobile"
      title="Readreceipt 2.0 — Mobile"
      subtitle="iPhone · 5 screens reflowed for one-thumb reading."
    >
      <DCArtboard id="m-landing" label="01 · Landing" width={440} height={920} dataScreenLabel="01 Landing">
        <Frame><MLanding/></Frame>
      </DCArtboard>
      <DCArtboard id="m-feed" label="02 · Feed" width={440} height={920} dataScreenLabel="02 Feed">
        <Frame><MFeed/></Frame>
      </DCArtboard>
      <DCArtboard id="m-detail" label="03 · Article timeline" width={440} height={920} dataScreenLabel="03 Detail">
        <Frame><MDetail/></Frame>
      </DCArtboard>
      <DCArtboard id="m-search" label="04 · Search" width={440} height={920} dataScreenLabel="04 Search">
        <Frame><MSearch/></Frame>
      </DCArtboard>
      <DCArtboard id="m-stats" label="05 · Stats" width={440} height={920} dataScreenLabel="05 Stats">
        <Frame><MStats/></Frame>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
