<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Readreceipt 2.0 — Design</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #1a1612; }
  body { font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  input, button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="lib.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
<script type="text/babel" src="feed.jsx"></script>
<script type="text/babel" src="detail.jsx"></script>
<script type="text/babel" src="search.jsx"></script>
<script type="text/babel" src="stats.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent":   "#C8311E",
  "density":  "comfortable",
  "ornaments": true
}/*EDITMODE-END*/;

const App = () => {
  const [t, setTweak] = useTweaks(TWEAKS_DEFAULTS);

  // Apply accent live by overriding RR.red on window.
  React.useEffect(() => {
    if (window.RR) window.RR.red = t.accent;
  }, [t.accent]);

  return (
    <>
      <DesignCanvas defaultZoom={0.6}>
        <DCSection id="overview" title="Readreceipt 2.0" subtitle="Modern editorial · cream paper, deep ink, italic serif accents · 5 screens.">
          <DCArtboard id="landing" label="01 · Landing" width={1280} height={1900} dataScreenLabel="01 Landing">
            <Landing/>
          </DCArtboard>
          <DCArtboard id="feed" label="02 · Articles feed" width={1280} height={1700} dataScreenLabel="02 Feed">
            <Feed/>
          </DCArtboard>
          <DCArtboard id="detail" label="03 · Article timeline" width={1280} height={1900} dataScreenLabel="03 Detail">
            <Detail/>
          </DCArtboard>
          <DCArtboard id="search" label="04 · Search" width={1280} height={1500} dataScreenLabel="04 Search">
            <Search/>
          </DCArtboard>
          <DCArtboard id="stats" label="05 · Stats" width={1280} height={2000} dataScreenLabel="05 Stats">
            <Stats/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Accent">
          <TweakColor
            label="Severity color"
            value={t.accent}
            onChange={v => setTweak('accent', v)}
            options={['#C8311E', '#8E1F14', '#1F8A5B', '#2A4A6B', '#B26A00']}
          />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakRadio
            label="Density"
            value={t.density}
            onChange={v => setTweak('density', v)}
            options={[
              { value: 'compact',     label: 'Compact' },
              { value: 'comfortable', label: 'Comfort' },
              { value: 'loose',       label: 'Loose' },
            ]}
          />
          <TweakToggle
            label="Mono kickers"
            value={t.ornaments}
            onChange={v => setTweak('ornaments', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
